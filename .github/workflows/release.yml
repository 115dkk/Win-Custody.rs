name: Release

# Publishes to crates.io when a `v<version>` tag is pushed, through crates.io
# trusted publishing (no stored token). The first release of a crate cannot use
# trusted publishing; see RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    # Windows, so the verification build in `cargo publish` compiles the real
    # code rather than the empty crate other targets see.
    runs-on: windows-2025
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag, the manifest and the changelog agree
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n 1 | cut -d '"' -f 4)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          if ! tr -d '\r' < CHANGELOG.md | grep -Eq "^## $manifest - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "::error::CHANGELOG.md has no dated '## $manifest - YYYY-MM-DD' entry"
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'win-custody-release (https://github.com/115dkk/Win-Custody.rs)' \
            "https://crates.io/api/v1/crates/win-custody/$manifest")"
          if [ "$status" = "200" ]; then
            echo "win-custody $manifest is already on crates.io; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.published == 'false'
        run: cargo test --all-targets

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.published == 'false'
        id: auth

      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
